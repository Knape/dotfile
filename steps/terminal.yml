---

- clean: ['~']

# See https://ohmyz.sh
- shell:
  - command: '[ -d "$HOME/.oh-my-zsh" ] || sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"'
    description: Install Oh-My-Zsh (if not already installed)
    stdout: true
    stderr: true

- link:
    # Terminal:
    ~/.shell:
      path: shell
      create: true
    ~/.bash_profile: config/bash_profile
    ~/.bashrc: config/bashrc
    ~/.zshrc:
      path: config/zshrc
      force: true
    ~/.zshenv:
      path: config/zshenv
      force: true

    ~/.hushlogin: config/hushlogin
    ~/.inputrc: config/inputrc
    ~/.zplugrc: config/zplugrc

    # Ghostty:
    ~/Library/Application Support/com.mitchellh.ghostty/config:
      path: config/ghostty
      force: true
      create: true

    # Git:
    ~/.gitconfig: config/gitconfig
    ~/.gitconfig_local: config/gitconfig_local
    ~/.gitignore_global: config/gitignore
    ~/.gitattributes_global: config/gitattributes

    # Tools:
    ~/.psqlrc: config/psqlrc
    ~/.sqliterc: config/sqliterc

    # Editors:
    ~/.editorconfig: config/editorconfig
    ~/.nanorc: config/nanorc

    # SSH:
    ~/.ssh/config:
      path: config/ssh_config
      force: true
      create: true

    # GPG:
    ~/.gnupg/gpg-agent.conf:
      path: config/gpgagent
      force: true
      create: true

